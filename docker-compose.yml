services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-intake-form
    ports:
      - "8080:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
