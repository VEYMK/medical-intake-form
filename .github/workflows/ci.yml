name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unit tests
        run: npm test

      - name: Static checks
        run: npm run check

      - name: Build Docker image
        run: docker build -t medical-intake-form:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name intake-ci -p 8080:80 medical-intake-form:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8080/ | grep -q "Анкета пациента"; then
              echo "Container responds correctly"
              exit 0
            fi
            sleep 1
          done
          docker logs intake-ci
          exit 1
